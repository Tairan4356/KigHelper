<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#fdf2f8">
    <title>娃语 · 扩列卡片</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'PingFang SC', 'Microsoft YaHei', 'system-ui', 'sans-serif'],
                        display: ['"Space Grotesk"', '"Noto Sans SC"', 'PingFang SC', 'system-ui', 'sans-serif']
                    },
                    borderRadius: {
                        '4xl': '2rem',
                        '5xl': '2.75rem'
                    },
                    boxShadow: {
                        'm3-card': '0 24px 60px rgba(105, 31, 65, 0.12)',
                        'm3-hero': '0 16px 36px rgba(180, 31, 88, 0.22)',
                        'm3-fab': '0 8px 20px rgba(105, 31, 65, 0.14)'
                    },
                    keyframes: {
                        'm3-card-enter': {
                            from: {opacity: '0', transform: 'translateY(24px) scale(0.985)'},
                            to: {opacity: '1', transform: 'translateY(0) scale(1)'}
                        },
                        'm3-panel-enter': {
                            from: {opacity: '0', transform: 'translateY(14px) scale(0.99)'},
                            to: {opacity: '1', transform: 'translateY(0) scale(1)'}
                        },
                        'm3-contact-enter': {
                            from: {opacity: '0', transform: 'translateY(12px) scale(0.99)'},
                            to: {opacity: '1', transform: 'translateY(0) scale(1)'}
                        }
                    },
                    animation: {
                        'm3-card-enter': 'm3-card-enter 680ms cubic-bezier(0.2, 0.8, 0.2, 1) both',
                        'm3-panel-enter': 'm3-panel-enter 700ms cubic-bezier(0.2, 0.8, 0.2, 1) 70ms both',
                        'm3-contact-enter': 'm3-contact-enter 540ms cubic-bezier(0.2, 0.8, 0.2, 1) both'
                    }
                }
            }
        };
    </script>
    <style type="text/tailwindcss">
        @layer base {
            [hidden] {
                display: none !important;
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 1ms !important;
                    animation-delay: 0ms !important;
                    transition-duration: 1ms !important;
                }
            }
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-pink-50 font-sans text-neutral-800 antialiased">

<main class="relative z-10 mx-auto w-full max-w-4xl px-4 pb-14 pt-8 sm:px-6">
    <header class="mb-5 px-1">
        <a href="../index.html" class="group inline-flex items-center gap-3 rounded-3xl"
           aria-label="娃语首页">
        <span class="grid h-14 w-14 flex-none -rotate-3 place-items-center overflow-hidden transition-transform duration-200 group-hover:rotate-0 sm:h-16 sm:w-16">
            <img src="../favicon.png" alt="" class="h-full w-full object-cover">
        </span>
            <span class="flex min-w-0 flex-col">
            <strong class="text-2xl font-black leading-none tracking-tighter text-pink-600 sm:text-3xl">娃语</strong>
            <span class="mt-1 text-xs font-medium text-neutral-500">Kigurumi 辅助沟通 APP</span>
        </span>
        </a>
    </header>

    <article
            class="relative isolate w-full animate-m3-card-enter overflow-hidden rounded-4xl border border-pink-100 bg-white shadow-m3-card"
            aria-live="polite">
        <header class="flex items-center justify-between gap-4 px-5 pt-5 sm:px-8 sm:pt-6">
            <h2 class="mt-1 text-2xl font-black tracking-tight">扩列卡片</h2>
            <div class="flex flex-none items-center gap-2">
                <button id="share-button" type="button" aria-label="分享此卡片" hidden
                        class="grid h-11 w-11 place-items-center rounded-2xl bg-pink-100 text-pink-700 transition duration-200 hover:-translate-y-0.5 hover:bg-pink-200 active:scale-95">
                    <i class="fas fa-share-nodes"></i>
                </button>
                <button id="copy-button" type="button" aria-label="复制此卡片链接"
                        class="grid h-11 w-11 place-items-center rounded-2xl bg-pink-100 text-pink-700 transition duration-200 hover:-translate-y-0.5 hover:bg-pink-200 active:scale-95">
                    <i class="far fa-copy"></i>
                </button>
            </div>
        </header>

        <section id="loading"
                 class="flex min-h-[52vh] flex-col items-center justify-center gap-5 px-6 py-16 text-center"
                 role="status" aria-live="polite">
            <span class="h-14 w-14 animate-spin rounded-full border-4 border-pink-200 border-t-pink-600"
                  aria-hidden="true"></span>
            <div class="max-w-md">
                <p class="font-display text-xs font-bold uppercase tracking-[0.28em] text-pink-600">
                    KigHelper</p>
                <h1 class="mt-2 text-2xl font-black tracking-tight sm:text-3xl">正在打开卡片</h1>
            </div>
        </section>

        <section id="error"
                 class="flex min-h-[52vh] flex-col items-center justify-center gap-5 px-6 py-16 text-center"
                 hidden>
            <span class="grid h-[72px] w-[72px] place-items-center rounded-[1.75rem] bg-red-100 text-3xl text-red-600"
                  aria-hidden="true">
                <i class="fas fa-circle-exclamation"></i>
            </span>
            <div class="max-w-md">
                <p class="font-display text-xs font-bold uppercase tracking-[0.28em] text-red-500">
                    无法打开</p>
                <h1 class="mt-2 text-2xl font-black tracking-tight sm:text-3xl">
                    这张卡片暂时不可用</h1>
                <p id="error-message" class="mt-2 text-sm leading-relaxed text-neutral-500">
                    链接内容不完整或已损坏。</p>
            </div>
        </section>

        <div id="content" hidden>
            <section
                    class="relative isolate m-4 flex min-h-[12rem] flex-col justify-end overflow-hidden rounded-[1.75rem] bg-pink-600 p-7 text-white shadow-m3-hero animate-m3-panel-enter sm:m-5 sm:rounded-4xl sm:p-10"
                    aria-labelledby="nickname">
                <div class="relative z-10 max-w-2xl">
                    <h1 id="nickname"
                        class="text-4xl font-black leading-none tracking-tighter break-words sm:text-5xl md:text-6xl"></h1>
                    <p id="signature"
                       class="mt-4 whitespace-pre-wrap break-words text-base leading-relaxed text-pink-50 sm:text-lg"
                       hidden></p>
                    <p id="truncated"
                       class="mt-4 inline-flex items-center gap-2 rounded-full bg-white px-3.5 py-1.5 text-xs font-semibold text-pink-700"
                       hidden>
                        <span class="h-1.5 w-1.5 rounded-full bg-pink-600"
                              aria-hidden="true"></span>
                        内容已自动精简
                    </p>
                </div>
            </section>

            <section class="px-5 pb-2 pt-8 sm:px-8">
                <header class="mb-4 flex items-end justify-between gap-4">
                    <h2 class="mt-1 text-2xl font-black tracking-tight">联系方式</h2>
                    <span id="contact-count"
                          class="flex-none whitespace-nowrap rounded-full bg-pink-100 px-3.5 py-2 text-xs font-bold text-pink-800"></span>
                </header>
                <section id="contacts" class="flex flex-col gap-3"
                         aria-label="联系方式列表"></section>
            </section>
        </div>

        <footer class="flex flex-wrap items-center justify-center gap-2 px-5 pb-6 pt-2 text-xs text-neutral-500 sm:px-8">
            「娃语」没有云端服务器，您的个人信息不会被上传。
        </footer>
    </article>
</main>

<div id="toast"
     class="pointer-events-none fixed bottom-6 left-1/2 z-20 -translate-x-1/2 translate-y-4 scale-95 rounded-full bg-neutral-800 px-5 py-3 text-center text-sm font-semibold text-white opacity-0 shadow-xl transition duration-200"
     role="status" aria-live="polite" hidden></div>

<noscript>
    <p class="fixed inset-x-4 bottom-4 z-30 rounded-2xl bg-red-100 px-5 py-4 text-center text-sm text-red-800">
        请启用 JavaScript 以查看这张卡片。</p>
</noscript>

<script src="./vendor/pako.min.js" defer></script>
<script src="./card-codec.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
